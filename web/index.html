<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星点角色工坊</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/pixel-import.css"><link rel="stylesheet" href="/skill-workbench.css"><script src="/preview-layout.js" defer></script><script src="/editor-scroll.js" defer></script><link rel="stylesheet" href="/effect-channels.css"><script src="/effect-channels.js" defer></script><link rel="stylesheet" href="/about-tool.css"><script src="/about-tool.js" defer></script><script src="/app.js" defer></script><script src="/pixel-import.js" defer></script><script src="/skill-workbench.js" defer></script><script src="/character-workflow.js" defer></script><link rel="stylesheet" href="/native-workbench.css"><script src="/native-workbench.js" defer></script><script src="/ability-picker.js" defer></script><link rel="stylesheet" href="/ability-composition.css"><script src="/ability-composition.js" defer></script><script src="/mod-host.js" defer></script><script src="/compiled-preview.js" defer></script><script src="/authoring-guide.js" defer></script><script src="/audio-workbench.js" defer></script><script src="/sound-preview.js" defer></script><script src="/template-library.js" defer></script><link rel="stylesheet" href="/portrait-workbench.css"><script src="/portrait-workbench.js" defer></script><script src="/image-workbench.js" defer></script><script src="/desktop-window.js" defer></script></head>
<body>
  <header class="topbar"><div class="brand-group"><button id="home" class="brand" aria-label="返回工程首页"><span class="brand-mark">✦</span><span>星点<span class="brand-sub">角色工坊</span></span></button><button id="app-version" class="app-version" hidden></button></div><div id="project-caption" class="project-caption">为新的角色，赋予生命。</div><div class="top-actions"><span id="save-status">本地创作</span><button id="undo" title="撤销 Ctrl+Z" hidden>↶</button><button id="redo" title="重做 Ctrl+Y" hidden>↷</button><button id="save" hidden>保存工程</button><button id="export" class="primary" hidden>导出工程 <span>↗</span></button><button id="shutdown" class="quiet" aria-label="退出工具" title="退出工具">⏻</button></div></header>
  <div id="welcome" class="welcome">
    <div class="welcome-copy"><span class="eyebrow">STARPOINT CHARACTER STUDIO</span><h1>从一张画稿，<br>到一个完整的角色。</h1><p>立绘、像素动作、技能演出。<br>在同一个工作台里制作、调整和预览。</p></div>
    <div class="start-grid"><button id="new-original" class="start-card"><span class="start-symbol">＋</span><strong>原创角色</strong><span>预置常用动作槽位，导入自己的设定与画稿。</span><span class="start-link">开始创作 →</span></button><button id="import-template" class="start-card"><span class="start-symbol">▧</span><strong>基于角色模板</strong><span>打开角色参考包，继承素材、动作和结构。</span><span class="start-link">选择参考包 →</span></button></div>
    <section class="recent"><div class="section-title"><h2>最近的工程</h2><button id="import-project" class="quiet">打开工程 / 参考包 ↗</button></div><div id="recent-list"></div></section>
    <div class="welcome-foot"><span>素材保存在本机</span><span>可编辑工程随时交接</span><span>无需连接游戏服务器</span></div>
  </div>
  <div id="workspace" class="workspace" hidden>
    <aside class="navigation"><div class="nav-heading">角色制作</div><nav aria-label="制作模块"><button data-page="identity"><span>01</span>角色设定</button><button data-page="portraits"><span>02</span>立绘与界面</button><button data-page="animations"><span>03</span>像素动作</button><button data-page="effects"><span>04</span>技能制作</button><button data-page="voices"><span>05</span>声音与台词</button><button data-page="gameplay"><span>06</span>技能与能力</button></nav><div class="nav-bottom"><button data-page="checks">✓　检查与交付</button><div id="template-badge"></div></div></aside>
    <main id="content" class="content"></main>
  </div>
  <input id="zip-input" type="file" accept=".zip" hidden><input id="media-input" type="file" accept="image/png" multiple hidden>
  <dialog id="modal"><form method="dialog"><button class="modal-close" aria-label="关闭">×</button></form><div id="modal-content"></div></dialog>
  <div id="busy" class="busy" hidden><div><div class="spinner"></div><strong id="busy-label">处理中…</strong><span>请保留当前窗口</span></div></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body></html>
